# ~/.config/antic/guests/dev.toml
description = "tools for my agent"
packages = ["git"]

[spec]
cpus = 2
memory = "4G"

[network]
mode = "internet"   # none | internet | lan

# Optional egress filter. default = "deny" reaches only allow entries:
# domains (and subdomains if prefixed with *.) and CIDRs (like /32 or /24).
# With default = "allow" (the default), allow CIDRs are exceptions to the
# mode (e.g. one LAN host in "internet" mode). An allow list needs an
# explicit default.
# default = "deny"
# allow = ["github.com", "*.githubusercontent.com", "registry.npmjs.org", "192.168.11.50/32"]
# deny = [...]

# Port forwarding: forward host ports to guest
# [[network.ports]]
# host = 8080
# guest = 80
# proto = "tcp"          # "tcp" (default) | "udp" | "tcp,udp"
# description = "Web app"

[[shares]]
source = "~/Work"
mode = "rw"         # "rw" | "ro"

# [[shares]]
# source = "~/Docs/spec"
# mode = "ro"

[env]
# EDITOR = "nvim"
