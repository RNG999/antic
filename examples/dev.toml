# ~/.config/antic/guests/dev.toml
description = "tools for my agent"
packages = ["git"]

[spec]
cpus = 2
memory = "4G"

[network]
mode = "internet"   # none | internet | lan

# Optional egress allow list. Domains (and subdomains if prefixed with *.),
# IP addresses and CIDRs (must use CIDR notation like /32 or /24).
# allow = ["github.com", "*.githubusercontent.com", "registry.npmjs.org", "192.168.11.50/32"]
# deny = [...]

# Port forwarding: forward TCP ports from host to guest
# [[network.ports]]
# host = 8080
# guest = 80

[[shares]]
source = "~/Work"
mode = "rw"         # "rw" | "ro"

# [[shares]]
# source = "~/Docs/spec"
# mode = "ro"

[env]
# EDITOR = "nvim"
