# ~/.config/hanare/hanare.toml
version = 1
default_guest = "dev"

[policy]
# "hanare share add" outside these asks for confirmation.
share_roots = ["~/Work"]
# Never share these (in addition to the built-in list).
deny = []
# Export these names read-only inside shares too (in addition to .git, .claude, ...).
protect = []

[guests.dev]
description = "tools for my agent"
# The guest OS: nixosConfigurations.<attr> in this flake. Keep it outside shares.
flake = "~/.config/hanare/guest"
attr = "hanare"
cpus = 2
memory = "4G"
network = "filtered"   # none | filtered (internet only) | lan

[guests.dev.commands]
# ~/.local/bin links that run these in this guest ("hanare link sync").
link = []
# Commands that always run without network.
offline = []

# Host directories visible in the guest at the same path.
[[guests.dev.share]]
path = "~/Work"

