# ~/.config/hanare/hanare.toml

# Guest used when no NAME / -g / $HANARE_GUEST is given.
default = "dev"

[guests.dev]
# The guest OS: nixosConfigurations.<attr> in this flake. Shared read-only
# with the guest for "hanare guest apply"; keep it outside any share.
flake = "~/.config/hanare/guest"
attr = "hanare"
cpus = 2
memory = "4G"
disk_size = "20G"
# true: let the guest reach LAN, Tailscale (CGNAT) and link-local addresses.
# Enforced on the host (nftables in the guest's rootless network namespace).
allow_lan = false
# ~/.local/bin links that run these commands in this guest ("hanare link sync").
expose = []
# Commands that always run without network (like "hanare run --offline").
offline = []

# Host directories visible in the guest at the same path.
[[guests.dev.share]]
path = "~/Work"

