# ~/.config/hanare/hanare.toml

[guest]
# Flake with nixosConfigurations.hanare (default: ~/.config/hanare/guest).
# Shared read-only with the guest for "hanare switch"; keep it outside any [[share]].
flake = "~/.config/hanare/guest"

[vm]
cpus = 2
memory = "4G"
disk_size = "20G"
vsock_cid = 4242

[network]
# true: let the guest reach LAN, Tailscale (CGNAT) and link-local addresses.
# Enforced on the host (nftables in hanare's rootless network namespace).
allow_lan = false

# Host directories visible in the guest at the same path.
[[share]]
path = "~/Work"

# [[share]]
# path = "~/Docs/spec"
# read_only = true

[commands]
# ~/.local/bin links that run these commands in the guest ("hanare link" syncs them).
expose = []
# Commands that always run without network (like "hanare run --offline").
offline = []
