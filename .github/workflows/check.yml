# "just check" on every pull request and push to main: nix flake check
# (unit tests, property-based tests, Z3, TLC, Spacer, the TLC replay) and
# golangci-lint. The E2E tests need KVM and systemd --user, so they run on
# a developer's host ("just e2e run"), not here.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: nix flake check
        run: nix flake check -L
      - name: golangci-lint
        run: nix develop -c golangci-lint run ./...
